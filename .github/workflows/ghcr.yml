name: Publish GHCR candidate
on:
  push:
    branches: [publish/ghcr-0.1.1-ebb44e1]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/jfar-z/bug-paw-relay
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ebb44e1429ff39f7c2c0f9c461dff79f59e2dfa8
          persist-credentials: false

      - name: Build the Windows and Linux connector packages
        run: |
          docker run --rm -v "$PWD:/src" -w /src node:24.19.0-bookworm-slim bash -euc '
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev gcc-mingw-w64-x86-64 xz-utils zip unzip
            npm ci
            npm run build
            npm run package:connector
            cd dist/portable
            sha256sum --check *.sha256
          '

      - name: Build and check the server image
        run: |
          tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_ref="$IMAGE:$tag"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          docker build -t "$image_ref" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" .
          # 使用公开部署配置和临时数据目录验证两个容器。
          export RELAY_IMAGE="$image_ref" RELAY_DATA_ROOT="$RUNNER_TEMP/relay-data"
          export RELAY_PUBLIC_URL=https://relay.example.com RELAY_LIGHT_DOMAIN=apps.example.com
          export RELAY_LIGHT_KEY="$(openssl rand -hex 32)"
          sudo install -d -m 700 -o 1000 -g 1000 "$RELAY_DATA_ROOT/relay" "$RELAY_DATA_ROOT/light-host"
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T relay test -s /data/setup-token
          docker compose exec -T light-host test -s /data/light-apps.db
          docker compose exec -T -w /app/dist/web/downloads relay sh -ec '
            test -s release.json
            sha256sum -c *-linux-x64.tar.gz.sha256 *-windows-x64.zip.sha256
          '
          docker compose down

      - name: Push candidate and record its digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # 两个发布标签均取自通过容器检查的同一本地镜像。
          docker tag "$IMAGE_REF" "$IMAGE:0.1.1"
          docker tag "$IMAGE_REF" "$IMAGE:latest"
          docker push "$IMAGE:0.1.1"
          docker push "$IMAGE:latest"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
