name: validate
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      # Node 的规范路径可能展开 Windows 用户目录短名，测试统一在 runner 的临时目录创建文件。
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # 原生协议测试调用本机 CLI，通过本地模拟端点完成交互。
      - run: npm install --global @openai/codex@0.171.0 @anthropic-ai/claude-code@2.1.326
      # 失败用例可能遗留监听器，限制测试作业的最长运行时间并保留诊断日志。
      - run: npm test
        timeout-minutes: 6
      - run: npm run build
